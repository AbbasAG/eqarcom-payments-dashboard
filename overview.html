<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Management Overview — EQARCOM Digital Payments</title>
<!-- Per-organisation units/leases data loaded dynamically after auth — see auth guard below -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  min-height: 100vh;
}

/* ── Auth gate ── */
body:not(.authenticated) .header,
body:not(.authenticated) .tab-nav,
body:not(.authenticated) .main { visibility: hidden; }

/* ── Header ── */
.header {
  background: linear-gradient(135deg, #0c3248 0%, #10455F 50%, #1e3a5f 100%);
  padding: 28px 40px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid #1e4060;
}
.header-left { display: flex; align-items: center; gap: 16px; }
.header-badge {
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px; padding: 8px 14px;
  font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #6FB1C9;
}
.header-title { font-size: 22px; font-weight: 800; color: #f1f5f9; letter-spacing: -0.5px; }
.header-actions { display: flex; align-items: center; gap: 12px; }
.header-right { font-size: 12px; color: #4a7a96; }
.header-admin-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
  color: #6FB1C9; text-decoration: none; font-size: 12px; font-weight: 600;
  transition: background 0.15s;
}
.header-admin-btn:hover { background: rgba(255,255,255,0.18); }
.header-logout-btn {
  padding: 7px 14px; background: rgba(127,29,29,0.25);
  border: 1px solid rgba(185,28,28,0.35); border-radius: 8px;
  color: #fca5a5; font-size: 12px; font-weight: 600; cursor: pointer;
  font-family: inherit; transition: background 0.15s;
}
.header-logout-btn:hover { background: rgba(127,29,29,0.4); }

/* ── Tab navigation ── */
.tab-nav {
  display: flex; gap: 0; margin-bottom: 0;
  border-bottom: 1px solid #2d4060; background: #0f172a; padding: 0 28px;
}
.tab-link {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 14px 24px; font-size: 13px; font-weight: 600; font-family: inherit;
  color: #64748b; text-decoration: none;
  border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s;
}
.tab-link:hover { color: #94a3b8; }
.tab-link.active { color: #6FB1C9; border-bottom-color: #6FB1C9; }

/* ── Main ── */
.main { max-width: 1400px; margin: 0 auto; padding: 32px 28px 60px; }

/* ── Filters ── */
.filters-bar {
  background: #1e293b; border: 1px solid #2d4060; border-radius: 16px;
  padding: 18px 24px; margin-bottom: 28px;
  display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
}
.filter-group { display: flex; align-items: center; gap: 8px; }
.filter-group label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; }
.filter-group select {
  background: #0f172a; border: 1px solid #334155; color: #e2e8f0;
  padding: 8px 12px; border-radius: 8px; font-size: 13px; font-family: inherit;
  min-width: 180px; cursor: pointer; outline: none; transition: border-color 0.15s;
}
.filter-group select:focus { border-color: #357296; }
.reset-btn {
  background: transparent; border: 1px solid #334155; color: #64748b;
  padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600;
  font-family: inherit; cursor: pointer; transition: all .2s;
}
.reset-btn:hover { border-color: #357296; color: #e2e8f0; }
.pdf-btn {
  background: rgba(16,69,95,0.4); border: 1px solid #357296; color: #6FB1C9;
  padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600;
  font-family: inherit; cursor: pointer; transition: all .2s;
  display: inline-flex; align-items: center; gap: 6px;
}
.pdf-btn:hover { background: rgba(16,69,95,0.7); color: #fff; }
.pdf-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.pdf-btn svg { width: 14px; height: 14px; }

/* ── Dashboard content ── */
.dashboard { display: flex; flex-direction: column; gap: 24px; }

/* KPI Cards */
.kpi-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; }
.kpi-card { background: #1e293b; border: 1px solid #2d4060; border-radius: 12px; padding: 20px 24px; transition: all .2s; }
.kpi-card:hover { border-color: #357296; transform: translateY(-1px); }
.kpi-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; margin-bottom: 8px; }
.kpi-value { font-size: 28px; font-weight: 800; letter-spacing: -1px; color: #f1f5f9; }
.kpi-sub { display: flex; gap: 20px; margin-top: 10px; }
.kpi-sub-item { font-size: 13px; color: #64748b; }
.kpi-sub-item span { font-weight: 700; }
.kpi-sub-item.res span { color: #60a5fa; }
.kpi-sub-item.com span { color: #fbbf24; }
.kpi-note { font-size: 12px; color: #64748b; margin-top: 10px; padding-top: 9px; border-top: 1px solid #2d4060; line-height: 1.5; }
.kpi-note span { font-weight: 700; color: #94a3b8; }
.kpi-note.warn { color: #d19a30; }
.kpi-note.warn span { color: #fbbf24; }

/* Section */
.section { background: #1e293b; border: 1px solid #2d4060; border-radius: 12px; overflow: hidden; }
.section-header { padding: 16px 24px; border-bottom: 1px solid #2d4060; display: flex; align-items: center; justify-content: space-between; }
.section-title { font-size: 15px; font-weight: 700; color: #f1f5f9; }
.section-badge { font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 600; }
.badge-res { background: rgba(59,130,246,0.15); color: #60a5fa; }
.badge-com { background: rgba(251,191,36,0.15); color: #fbbf24; }

/* Tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: #172033; padding: 10px 16px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; border-bottom: 1px solid #2d4060; white-space: nowrap; }
td { padding: 10px 16px; border-bottom: 1px solid #1a2438; white-space: nowrap; }
tr:hover td { background: rgba(53,114,150,0.06); }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
th.num { text-align: right; }

.clickable { cursor: pointer; color: #6FB1C9; text-decoration: underline; text-decoration-style: dotted; transition: color .15s; }
.clickable:hover { color: #fff; }
.clickable-zero { color: #475569; }

/* Occupancy bar */
.occ-bar-wrap { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.occ-bar { flex: 1; height: 8px; background: #172033; border-radius: 4px; overflow: hidden; }
.occ-bar-fill { height: 100%; border-radius: 4px; transition: width .3s; }
.occ-pct { font-size: 12px; font-weight: 700; min-width: 42px; text-align: right; }

/* Drill-down */
.drill-down { display: none; background: #172033; border-top: 2px solid #357296; }
.drill-down.active { display: block; }
.drill-header { padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2d4060; }
.drill-header h3 { font-size: 14px; font-weight: 700; }
.drill-close { background: transparent; border: 1px solid #334155; color: #64748b; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: inherit; }
.drill-close:hover { border-color: #ef4444; color: #fca5a5; }

/* Charts area */
.charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.chart-card { background: #1e293b; border: 1px solid #2d4060; border-radius: 12px; padding: 20px 24px; }
.chart-title { font-size: 14px; font-weight: 700; margin-bottom: 16px; color: #f1f5f9; }

/* Bar chart */
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.bar-label { font-size: 12px; color: #94a3b8; min-width: 140px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-track { flex: 1; height: 22px; background: #172033; border-radius: 4px; overflow: hidden; position: relative; }
.bar-fill { height: 100%; border-radius: 4px; transition: width .4s; display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; }
.bar-val { font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; }
.bar-val-outside { font-size: 11px; font-weight: 600; color: #94a3b8; margin-left: 6px; white-space: nowrap; }

/* Subtype grid */
.subtype-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(140px,1fr)); gap: 10px; }
.subtype-item { background: #172033; border: 1px solid #2d4060; border-radius: 8px; padding: 14px; text-align: center; }
.subtype-count { font-size: 22px; font-weight: 800; }
.subtype-label { font-size: 11px; color: #94a3b8; margin-top: 4px; }
.subtype-rent { font-size: 11px; color: #4ade80; margin-top: 2px; }
.subtype-area { font-size: 11px; color: #22d3ee; margin-top: 2px; }

/* Scrollable drill */
.drill-table-wrap { max-height: 350px; overflow-y: auto; }
.drill-table-wrap::-webkit-scrollbar { width: 6px; }
.drill-table-wrap::-webkit-scrollbar-track { background: #0f172a; }
.drill-table-wrap::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

/* Responsive */
@media (max-width: 1200px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } .charts-row { grid-template-columns: 1fr; } }
@media (max-width: 768px) { .kpi-row { grid-template-columns: 1fr; } }

/* Portrait warning */
.portrait-warning {
  display: none; position: fixed; inset: 0; z-index: 9999;
  background: #0f172a; align-items: center; justify-content: center;
  flex-direction: column; text-align: center; padding: 40px;
  font-family: 'Inter', system-ui, sans-serif; color: #e2e8f0;
}
.portrait-warning svg { width: 64px; height: 64px; margin-bottom: 24px; color: #6FB1C9; }
.portrait-warning h2 { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
.portrait-warning p { font-size: 14px; color: #94a3b8; max-width: 300px; line-height: 1.5; }
@media screen and (max-width: 767px) and (orientation: portrait) {
  .portrait-warning { display: flex !important; }
}
</style>
</head>
<body>

<!-- Portrait warning -->
<div class="portrait-warning">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="2" width="16" height="20" rx="2" ry="2" transform="rotate(90 12 12)"/>
    <path d="M12 18h.01"/>
  </svg>
  <h2>Please rotate your device</h2>
  <p>This dashboard is optimised for landscape viewing. Please rotate your device to landscape mode.</p>
</div>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div class="header-badge">EQARCOM</div>
    <div>
      <div class="header-title">EQARCOM Usage Dashboards</div>
    </div>
  </div>
  <div class="header-actions">
    <span class="header-right" id="data-timestamp"></span>
    <a href="admin.html" id="admin-link" class="header-admin-btn" style="display:none;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Users
    </a>

<!-- Tab navigation -->
<div class="tab-nav">

<div class="main">
  <div class="filters-bar">
    <div class="filter-group" id="orgFilterGroup" style="display:none;">
      <label>Organisation</label>
      <select id="filterOrg"></select>
    </div>
    <div class="filter-group">
      <label>Property</label>
      <select id="filterProperty"><option value="">All Properties</option></select>
    </div>
    <div class="filter-group">
      <label>Usage Type</label>
      <select id="filterUsage">
        <option value="">All</option>
        <option value="Residential">Residential</option>
        <option value="Commercial">Commercial</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Owner</label>
      <select id="filterOwner"><option value="">All Owners</option></select>
    </div>
    <button class="reset-btn" onclick="resetFilters()">Reset Filters</button>
    <button class="pdf-btn" id="pdf-btn" style="display:none;" title="Download owner report as PDF">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="M12 11v6"/><path d="M9 14l3 3 3-3"/></svg>
      Download Owner Report
    </button>
  </div>

  <div class="dashboard" id="dashboard"></div>
</div>

<script>
const TODAY = new Date();
const MS_DAY = 86400000;
// Residential is a closed list of three unit types; anything else that has a
// unit type at all counts as Commercial. Classifying from unit_type on read
// (rather than trusting the stored usage_type) means data uploaded under the
// older rules is classified correctly without needing a re-upload.
const RESIDENTIAL_UNIT_TYPES = /apartment|villa|penthouse/;

// A lease counts as "in place" — the unit is occupied and generating rent —
// when it is Active, and also when it has Expired. An expired lease normally
// means the tenant is still in occupation while a renewal is processed, so
// excluding it understates occupied units, rent and area.
//
// Matched on patterns rather than exact strings, because source systems write
// this column inconsistently ("Expired", "Lease Expired", "Expired - Renewal
// Pending"). Exclusions are checked first so "Inactive" and "Terminated" can
// never slip through. Anything unrecognised is excluded and reported on the
// Total Units card rather than silently dropped.
const IN_PLACE_STATUS     = /\bactive\b|expir|holdover|occupied|renew/i;
const NOT_IN_PLACE_STATUS = /terminat|cancel|void|draft|inactive|vacat|reject|closed|pending\s*approval/i;

function isInPlaceLease(l) {
  const st = String((l && l.status) || '').trim();
  if (!st) return false;
  if (NOT_IN_PLACE_STATUS.test(st)) return false;
  return IN_PLACE_STATUS.test(st);
}

function usageOf(x) {
  const t = String((x && x.unit_type) || '').trim().toLowerCase();
  if (t) return RESIDENTIAL_UNIT_TYPES.test(t) ? 'Residential' : 'Commercial';
  // No unit type to go on — fall back to whatever was stored.
  const u = String((x && x.usage_type) || '').trim();
  if (u === 'Residential') return 'Residential';
  return u ? 'Commercial' : '';
}

function daysDiff(dateStr) {
  return Math.floor((new Date(dateStr) - TODAY) / MS_DAY);
}

function fmt(n) {
  if (n == null) return '-';
  return Number(n).toLocaleString('en-US');
}

function fmtCurrency(n) {
  if (n == null) return '-';
  return 'AED ' + Number(n).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0});
}

function fmtArea(n) {
  if (n == null || n === 0) return '-';
  return Number(n).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0}) + ' sq.ft';
}

function pct(n, d) {
  if (!d) return '0.0';
  return ((n / d) * 100).toFixed(1);
}

function occColor(p) {
  if (p >= 90) return '#4ade80';
  if (p >= 70) return '#fbbf24';
  return '#f87171';
}

// Unit types can arrive with inconsistent casing between exports
// ("Villa" vs "VILLA"), which would otherwise split one unit type across two
// groups and drop rows out of the type-matched tables below. Normalise on read
// so older uploads display correctly too.
function normUnitType(t) {
  const s = String(t == null ? '' : t).trim();
  if (!s) return '';
  return s.toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase());
}

function normBedroom(b) {
  if (!b) return 'Unknown';
  const s = String(b).trim();
  if (/studio/i.test(s)) return 'Studio';
  if (/^1BR/i.test(s)) return '1 Bed';
  if (/^2BR/i.test(s)) return '2 Beds';
  if (/^3BR/i.test(s)) return '3 Beds';
  if (/^4BR/i.test(s)) return '4 Beds';
  if (/^5BR/i.test(s)) return '5 Beds';
  return s;
}

let filters = { property: '', usage: '', owner: '' };

// Units / leases for the currently selected organisation.
// Populated by loadOverviewData().
let OVERVIEW_DATA = { units: [], leases: [], properties: [], owners: [] };

function initFilters() {
  const propSel = document.getElementById('filterProperty');
  const ownerSel = document.getElementById('filterOwner');
  // Rebuilt from scratch each time so switching organisation doesn't
  // leave the previous org's properties/owners in the dropdowns.
  propSel.innerHTML = '<option value="">All Properties</option>';
  ownerSel.innerHTML = '<option value="">All Owners</option>';
  OVERVIEW_DATA.properties.forEach(p => {
    propSel.innerHTML += `<option value="${p}">${p}</option>`;
  });
  OVERVIEW_DATA.owners.forEach(o => {
    ownerSel.innerHTML += `<option value="${o}">${o}</option>`;
  });
}

function updatePdfButton() {
  var btn = document.getElementById('pdf-btn');
  var owner = document.getElementById('filterOwner').value;
  btn.style.display = owner ? 'inline-flex' : 'none';
}

function applyFilters() {
  filters.property = document.getElementById('filterProperty').value;
  filters.usage = document.getElementById('filterUsage').value;
  filters.owner = document.getElementById('filterOwner').value;
  updatePdfButton();
  render();
}

function resetFilters() {
  document.getElementById('filterProperty').value = '';
  document.getElementById('filterUsage').value = '';
  document.getElementById('filterOwner').value = '';
  filters = { property: '', usage: '', owner: '' };
  updatePdfButton();
  render();
}

function getFilteredData() {
  let units = OVERVIEW_DATA.units;
  let leases = OVERVIEW_DATA.leases;

  if (filters.property) {
    units = units.filter(u => u.property === filters.property);
    leases = leases.filter(l => l.property === filters.property);
  }
  if (filters.usage) {
    units = units.filter(u => usageOf(u) === filters.usage);
    leases = leases.filter(l => usageOf(l) === filters.usage);
  }
  if (filters.owner) {
    leases = leases.filter(l => l.owner === filters.owner);
    const leasedCodes = new Set(leases.map(l => l.unit_code));
    units = units.filter(u => leasedCodes.has(u.unit_code) || !filters.owner);
  }

  return { units, leases };
}

function render() {
  const { units, leases } = getFilteredData();
  const inPlaceLeases = leases.filter(isInPlaceLease);
  const db = document.getElementById('dashboard');

  let html = '';

  // --- KPI Row ---
  const totalUnits = units.length;
  const resUnits = units.filter(u => usageOf(u) === 'Residential').length;
  const comUnits = units.filter(u => usageOf(u) === 'Commercial').length;
  // Units with no Unit Type at all can't be classified. Surfaced explicitly so
  // the sub-counts always reconcile with Total Units.
  const otherUnits = totalUnits - resUnits - comUnits;

  const totalRent = inPlaceLeases.reduce((s, l) => s + (l.annual_rent || 0), 0);
  const resRent = inPlaceLeases.filter(l => usageOf(l) === 'Residential').reduce((s, l) => s + (l.annual_rent || 0), 0);
  const comRent = inPlaceLeases.filter(l => usageOf(l) === 'Commercial').reduce((s, l) => s + (l.annual_rent || 0), 0);

  const totalArea = inPlaceLeases.reduce((s, l) => s + (l.built_up_area || 0), 0);
  const resArea = inPlaceLeases.filter(l => usageOf(l) === 'Residential').reduce((s, l) => s + (l.built_up_area || 0), 0);
  const comArea = inPlaceLeases.filter(l => usageOf(l) === 'Commercial').reduce((s, l) => s + (l.built_up_area || 0), 0);

  const occupiedUnits = units.filter(u => u.status === 'Occupied').length;
  const occPct = pct(occupiedUnits, totalUnits);
  const resOcc = units.filter(u => usageOf(u) === 'Residential');
  const resOccupied = resOcc.filter(u => u.status === 'Occupied').length;
  const comOcc = units.filter(u => usageOf(u) === 'Commercial');

  // Total Units counts rows in the Units extract; every other figure on this
  // page is built from Active leases. The two disagree whenever a unit has no
  // in-place lease behind it, so state the reconciliation on the card rather
  // than leaving it to be inferred by adding up the subtype tiles.
  const inPlaceLeaseCount = inPlaceLeases.length;
  const leasedCodes       = new Set(inPlaceLeases.map(l => l.unit_code).filter(Boolean));
  const unitsWithLease    = units.filter(u => leasedCodes.has(u.unit_code)).length;
  const unitsWithoutLease = totalUnits - unitsWithLease;
  const unitCodes         = new Set(units.map(u => u.unit_code).filter(Boolean));
  const unmatchedLeases   = inPlaceLeases.filter(l => !l.unit_code || !unitCodes.has(l.unit_code)).length;

  // Any lease excluded by status is reported by name, so a status string this
  // page doesn't recognise is visible rather than just a missing count.
  const excludedByStatus = {};
  leases.forEach(l => {
    if (isInPlaceLease(l)) return;
    const st = String((l && l.status) || '').trim() || '(blank)';
    excludedByStatus[st] = (excludedByStatus[st] || 0) + 1;
  });
  const excludedEntries = Object.entries(excludedByStatus).sort((a, b) => b[1] - a[1]);
  const excludedNote = excludedEntries
    .map(([st, n]) => `${st} (${fmt(n)})`)
    .join(', ');

  let leaseNote;
  if (totalUnits === 0) {
    leaseNote = `<span>${fmt(inPlaceLeaseCount)}</span> in-place leases`;
  } else if (unitsWithoutLease <= 0 && unmatchedLeases <= 0) {
    leaseNote = `<span>${fmt(inPlaceLeaseCount)}</span> in-place leases &middot; every unit leased`;
  } else {
    leaseNote = `<span>${fmt(inPlaceLeaseCount)}</span> in-place leases`;
    if (unitsWithoutLease > 0) {
      leaseNote += ` &middot; <span>${fmt(unitsWithoutLease)}</span> of ${fmt(totalUnits)} units with no in-place lease`;
    }
    if (unmatchedLeases > 0) {
      leaseNote += ` &middot; <span>${fmt(unmatchedLeases)}</span> leases with no matching unit`;
    }
  }
  if (excludedEntries.length) {
    leaseNote += `<br>Leases excluded by status: <span>${excludedNote}</span>`;
  }
  const comOccupied = comOcc.filter(u => u.status === 'Occupied').length;

  html += `<div class="kpi-row">
    <div class="kpi-card">
      <div class="kpi-label">Total Units</div>
      <div class="kpi-value">${fmt(totalUnits)}</div>
      <div class="kpi-sub">
        <div class="kpi-sub-item res"><span>${fmt(resUnits)}</span> Residential</div>
        <div class="kpi-sub-item com"><span>${fmt(comUnits)}</span> Commercial</div>
        ${otherUnits > 0 ? `<div class="kpi-sub-item" style="color:#f87171"><span style="color:#f87171">${fmt(otherUnits)}</span> No Unit Type</div>` : ''}
      </div>
      <div class="kpi-note${(unitsWithoutLease > 0 || unmatchedLeases > 0) ? ' warn' : ''}">${leaseNote}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Total Rent Pool (In-Place Leases)</div>
      <div class="kpi-value" style="color:#4ade80">${fmtCurrency(totalRent)}</div>
      <div class="kpi-sub">
        <div class="kpi-sub-item res"><span>${fmtCurrency(resRent)}</span> Residential</div>
        <div class="kpi-sub-item com"><span>${fmtCurrency(comRent)}</span> Commercial</div>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Total Area Leased (In-Place)</div>
      <div class="kpi-value" style="color:#22d3ee">${fmtArea(totalArea)}</div>
      <div class="kpi-sub">
        <div class="kpi-sub-item res"><span>${fmtArea(resArea)}</span> Residential</div>
        <div class="kpi-sub-item com"><span>${fmtArea(comArea)}</span> Commercial</div>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Overall Occupancy</div>
      <div class="kpi-value" style="color:${occColor(parseFloat(occPct))}">${occPct}%</div>
      <div class="kpi-sub">
        <div class="kpi-sub-item res"><span>${pct(resOccupied, resOcc.length)}%</span> Residential</div>
        <div class="kpi-sub-item com"><span>${pct(comOccupied, comOcc.length)}%</span> Commercial</div>
      </div>
    </div>
  </div>`;

  // --- Subtype splits ---
  function subtypeGrid(arr, color, showArea) {
    const bedMap = {};
    arr.forEach(l => {
      const b = color === '#60a5fa' ? normBedroom(l.bedrooms) : (l.bedrooms || normUnitType(l.unit_type) || 'Other');
      if (!bedMap[b]) bedMap[b] = { count:0, rent:0, area:0 };
      bedMap[b].count++;
      bedMap[b].rent += (l.annual_rent || 0);
      bedMap[b].area += (l.built_up_area || 0);
    });
    let h = '';
    Object.entries(bedMap).sort((a,b) => b[1].count - a[1].count).forEach(([bed, d]) => {
      h += `<div class="subtype-item">
        <div class="subtype-count" style="color:${color}">${d.count}</div>
        <div class="subtype-label">${bed}</div>
        <div class="subtype-rent">${fmtCurrency(d.rent)}</div>
        ${showArea ? `<div class="subtype-area">${fmtArea(d.area)}</div>` : ''}
      </div>`;
    });
    return h;
  }

  const resLeased = inPlaceLeases.filter(l => usageOf(l) === 'Residential');
  const resUTG = {};
  resLeased.forEach(l => { const ut = normUnitType(l.unit_type) || 'Other'; if (!resUTG[ut]) resUTG[ut] = []; resUTG[ut].push(l); });
  // Sections are only emitted when they have content, so a portfolio with (say)
  // no residential leases doesn't render an empty shell.
  if (Object.keys(resUTG).length) {
    html += `<div class="charts-row">`;
    Object.entries(resUTG).sort((a,b) => b[1].length - a[1].length).forEach(([ut, arr]) => {
      html += `<div class="chart-card"><div class="chart-title">${ut} Leased Units by Subtype <span style="color:#60a5fa;font-size:13px;margin-left:8px">(${arr.length} units)</span></div><div class="subtype-grid">${subtypeGrid(arr, '#60a5fa', false)}</div></div>`;
    });
    html += `</div>`;
  }

  const comLeased = inPlaceLeases.filter(l => usageOf(l) === 'Commercial');
  const comUTG = {};
  comLeased.forEach(l => { const ut = normUnitType(l.unit_type) || 'Other'; if (!comUTG[ut]) comUTG[ut] = []; comUTG[ut].push(l); });
  if (Object.keys(comUTG).length) {
    html += `<div class="charts-row">`;
    Object.entries(comUTG).sort((a,b) => b[1].length - a[1].length).forEach(([ut, arr]) => {
      html += `<div class="chart-card"><div class="chart-title">${ut} Leased Units by Subtype <span style="color:#fbbf24;font-size:13px;margin-left:8px">(${arr.length} units)</span></div><div class="subtype-grid">${subtypeGrid(arr, '#fbbf24', true)}</div></div>`;
    });
    html += `</div>`;
  }

  // --- Occupancy by Property ---
  const propMap = {};
  units.forEach(u => {
    if (!propMap[u.property]) propMap[u.property] = { total:0, occupied:0, resTot:0, resOcc:0, comTot:0, comOcc:0, resRent:0, comRent:0 };
    propMap[u.property].total++;
    if (u.status === 'Occupied') propMap[u.property].occupied++;
    const usage = usageOf(u);
    if (usage === 'Residential') { propMap[u.property].resTot++; if (u.status === 'Occupied') propMap[u.property].resOcc++; }
    else if (usage === 'Commercial') { propMap[u.property].comTot++; if (u.status === 'Occupied') propMap[u.property].comOcc++; }
  });
  inPlaceLeases.forEach(l => {
    if (propMap[l.property]) {
      if (usageOf(l) === 'Residential') propMap[l.property].resRent += (l.annual_rent || 0);
      else if (usageOf(l) === 'Commercial') propMap[l.property].comRent += (l.annual_rent || 0);
    }
  });

  const propEntries = Object.entries(propMap).sort((a, b) => b[1].total - a[1].total);
  if (propEntries.length) {
  html += `<div class="section"><div class="section-header"><div class="section-title">Occupancy by Property</div></div><div class="table-wrap"><table>
    <tr><th>Property</th><th class="num">Total Units</th><th>Occupancy</th><th class="num">Res. Units</th><th class="num">Res. Occ%</th><th class="num">Res. Rent</th><th class="num">Com. Units</th><th class="num">Com. Occ%</th><th class="num">Com. Rent</th></tr>`;
  propEntries.forEach(([prop, d]) => {
    const op = pct(d.occupied, d.total);
    const rp = pct(d.resOcc, d.resTot);
    const cp = pct(d.comOcc, d.comTot);
    html += `<tr>
      <td><strong>${prop}</strong></td><td class="num">${d.total}</td>
      <td><div class="occ-bar-wrap"><div class="occ-bar"><div class="occ-bar-fill" style="width:${op}%;background:${occColor(parseFloat(op))}"></div></div><div class="occ-pct" style="color:${occColor(parseFloat(op))}">${op}%</div></div></td>
      <td class="num">${d.resTot}</td><td class="num" style="color:#60a5fa">${rp}%</td><td class="num">${fmtCurrency(d.resRent)}</td>
      <td class="num">${d.comTot}</td><td class="num" style="color:#fbbf24">${cp}%</td><td class="num">${fmtCurrency(d.comRent)}</td></tr>`;
  });
  html += `</table></div></div>`;
  }

  // --- Active Leases Overview ---
  ['Residential', 'Commercial'].forEach(uType => {
    const badge = uType === 'Residential' ? 'badge-res' : 'badge-com';
    const sectionId = uType.toLowerCase();
    // Restricted to in-place leases so this table reconciles with the KPI
    // card above. Terminated / cancelled leases aren't pending expiry.
    const filtered = leases.filter(l => isInPlaceLease(l) && usageOf(l) === uType);
    if (!filtered.length) return;   // no leases of this usage type — omit the section

    const propLeases = {};
    filtered.forEach(l => { if (!propLeases[l.property]) propLeases[l.property] = []; propLeases[l.property].push(l); });

    function bucketize(arr) {
      const buckets = { total:arr.length, expired:0, d30:0, d60:0, d90:0, d120:0 };
      arr.forEach(l => {
        const dd = daysDiff(l.end_date);
        if (dd < 0) buckets.expired++;
        else if (dd <= 30) buckets.d30++;
        else if (dd <= 60) buckets.d60++;
        else if (dd <= 90) buckets.d90++;
        else if (dd <= 120) buckets.d120++;
      });
      return buckets;
    }

    const propRows = Object.entries(propLeases).sort((a,b) => b[1].length - a[1].length);
    const allBuckets = bucketize(filtered);

    html += `<div class="section" id="section-${sectionId}"><div class="section-header"><div class="section-title">Lease Expiry Overview</div><div class="section-badge ${badge}">${uType}</div></div><div class="table-wrap"><table>
      <tr><th>Property</th><th class="num">Total Leased</th><th class="num">Expiring 120d</th><th class="num">Expiring 90d</th><th class="num">Expiring 60d</th><th class="num">Expiring 30d</th><th class="num">Expired</th></tr>`;

    function cellClick(prop, bucket, type) { return `onclick="showDrill('${type}','${prop.replace(/'/g,"\\'")}','${bucket}')" class="clickable"`; }
    function cellVal(val, prop, bucket, type) {
      if (val === 0) return `<td class="num clickable-zero">0</td>`;
      return `<td class="num" ${cellClick(prop, bucket, type)}>${val}</td>`;
    }

    propRows.forEach(([prop, arr]) => {
      const b = bucketize(arr);
      html += `<tr><td><strong>${prop}</strong></td>${cellVal(b.total, prop, 'total', sectionId)}${cellVal(b.d120, prop, 'd120', sectionId)}${cellVal(b.d90, prop, 'd90', sectionId)}${cellVal(b.d60, prop, 'd60', sectionId)}${cellVal(b.d30, prop, 'd30', sectionId)}${cellVal(b.expired, prop, 'expired', sectionId)}</tr>`;
    });
    html += `<tr style="background:#172033;font-weight:700"><td>TOTAL</td>${cellVal(allBuckets.total, 'ALL', 'total', sectionId)}${cellVal(allBuckets.d120, 'ALL', 'd120', sectionId)}${cellVal(allBuckets.d90, 'ALL', 'd90', sectionId)}${cellVal(allBuckets.d60, 'ALL', 'd60', sectionId)}${cellVal(allBuckets.d30, 'ALL', 'd30', sectionId)}${cellVal(allBuckets.expired, 'ALL', 'expired', sectionId)}</tr>`;
    html += `</table></div><div class="drill-down" id="drill-${sectionId}"></div></div>`;
  });

  // --- Nationality Split ---
  const natMap = {};
  inPlaceLeases.forEach(l => { const n = l.nationality || 'Not Specified'; natMap[n] = (natMap[n] || 0) + 1; });
  const natEntries = Object.entries(natMap).sort((a,b) => b[1] - a[1]);
  const maxNat = natEntries.length ? natEntries[0][1] : 1;
  const natTotal = inPlaceLeases.length;

  if (natEntries.length) {
  html += `<div class="section"><div class="section-header"><div class="section-title">Nationality Split - Current Tenants</div></div><div style="padding:20px 24px; max-height:400px; overflow-y:auto;">`;
  natEntries.forEach(([nat, count]) => {
    const w = (count / maxNat) * 100;
    const p = ((count / natTotal) * 100).toFixed(1);
    html += `<div class="bar-row"><div class="bar-label">${nat}</div><div class="bar-track"><div class="bar-fill" style="width:${w}%;background:#357296"><span class="bar-val">${w > 18 ? count + ' (' + p + '%)' : ''}</span></div></div>${w <= 18 ? `<span class="bar-val-outside">${count} (${p}%)</span>` : ''}</div>`;
  });
  html += `</div></div>`;
  }

  // Nothing matched the current filters at all — say so rather than leaving
  // four zeroed cards floating on an otherwise blank page.
  if (!units.length && !leases.length) {
    html = `<p style="text-align:center;color:#94a3b8;padding:40px;">No units or leases match the current filters.</p>`;
  }

  db.innerHTML = html;
  if (window.overviewLastUpdated) {
    document.getElementById('data-timestamp').textContent = 'Units & Leases data updated ' + window.overviewLastUpdated;
  }
}

// Drill-down
window.showDrill = function(type, property, bucket) {
  const { leases } = getFilteredData();
  const wantUsage = type === 'residential' ? 'Residential' : 'Commercial';
  let filtered = leases.filter(l => isInPlaceLease(l) && usageOf(l) === wantUsage);
  if (property !== 'ALL') filtered = filtered.filter(l => l.property === property);

  let bucketLabel = '';
  if (bucket === 'total') { bucketLabel = 'All Leases'; }
  else if (bucket === 'expired') { filtered = filtered.filter(l => daysDiff(l.end_date) < 0); bucketLabel = 'Expired'; }
  else if (bucket === 'd30') { filtered = filtered.filter(l => { const d = daysDiff(l.end_date); return d >= 0 && d <= 30; }); bucketLabel = 'Expiring in 30 days'; }
  else if (bucket === 'd60') { filtered = filtered.filter(l => { const d = daysDiff(l.end_date); return d > 30 && d <= 60; }); bucketLabel = 'Expiring in 31-60 days'; }
  else if (bucket === 'd90') { filtered = filtered.filter(l => { const d = daysDiff(l.end_date); return d > 60 && d <= 90; }); bucketLabel = 'Expiring in 61-90 days'; }
  else if (bucket === 'd120') { filtered = filtered.filter(l => { const d = daysDiff(l.end_date); return d > 90 && d <= 120; }); bucketLabel = 'Expiring in 91-120 days'; }

  const drillEl = document.getElementById('drill-' + type);
  let h = `<div class="drill-header"><h3>${property === 'ALL' ? 'All Properties' : property} - ${bucketLabel} (${filtered.length} leases)</h3><button class="drill-close" onclick="closeDrill('${type}')">Close</button></div>
  <div class="drill-table-wrap"><table>
    <tr><th>Unit Code</th><th>Tenant</th><th>Unit Type</th><th>Subtype</th><th class="num">Annual Rent</th><th>Start Date</th><th>End Date</th><th class="num">Days Left</th><th>Nationality</th><th>Contract Type</th><th>Ejari No</th></tr>`;

  filtered.sort((a,b) => new Date(a.end_date) - new Date(b.end_date)).forEach(l => {
    const dd = daysDiff(l.end_date);
    const ddColor = dd < 0 ? '#f87171' : dd <= 30 ? '#fbbf24' : dd <= 90 ? '#22d3ee' : '#e2e8f0';
    h += `<tr><td>${l.unit_code || '-'}</td><td>${l.tenant || '-'}</td><td>${normUnitType(l.unit_type) || '-'}</td><td>${l.bedrooms || '-'}</td><td class="num">${fmtCurrency(l.annual_rent)}</td><td>${l.start_date || '-'}</td><td>${l.end_date || '-'}</td><td class="num" style="color:${ddColor};font-weight:700">${dd}</td><td>${l.nationality || '-'}</td><td>${l.contract_type || '-'}</td><td style="font-size:11px">${l.ejari_no || '-'}</td></tr>`;
  });
  h += `</table></div>`;
  drillEl.innerHTML = h;
  drillEl.classList.add('active');
  drillEl.scrollIntoView({ behavior:'smooth', block:'nearest' });
};

window.closeDrill = function(type) {
  const el = document.getElementById('drill-' + type);
  el.classList.remove('active');
  el.innerHTML = '';
};

// ── Per-organisation data loading ───────────────────────────
// Each organisation has its own extract at
//   private/overview/{orgId}/data.json
// The legacy single-org file (private/eqarat_data.js) is still read as a
// fallback for the default org until its per-org file has been uploaded.
const LEGACY_ORG_ID   = 'eqarat';
const LEGACY_ORG_PATH = 'private/eqarat_data.js';

// The legacy file is `const EQARAT_DATA = {...};` — take the object literal
// after the first '=' and JSON.parse it. No eval, no script injection.
function parseLegacyOverviewJs(text) {
  const i = text.indexOf('=');
  if (i < 0) throw new Error('Unrecognised legacy overview file format');
  return JSON.parse(text.slice(i + 1).trim().replace(/;\s*$/, ''));
}

function setDataTimestamp(updated) {
  if (!updated) { window.overviewLastUpdated = null; return; }
  window.overviewLastUpdated =
    updated.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
    + ' ' + updated.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function showOverviewMessage(text) {
  document.getElementById('dashboard').innerHTML =
    '<p style="text-align:center;color:#94a3b8;padding:40px;">' + text + '</p>';
}

window.loadOverviewData = function(orgId) {
  if (!orgId) {
    showOverviewMessage('No organisation has been assigned to your account. Please contact an administrator.');
    return Promise.resolve();
  }

  showOverviewMessage('Loading data…');
  document.getElementById('data-timestamp').textContent = '';

  return import('./firebase-init.js').then(function(mod) {
    return mod.fetchPrivateJson('private/overview/' + orgId + '/data.json')
      .then(function(result) {
        return { data: result.json, updated: result.updated };
      })
      .catch(function(err) {
        // Fallback: default org that hasn't been re-uploaded in the new format yet.
        if (orgId !== LEGACY_ORG_ID) throw err;
        return mod.fetchPrivateText(LEGACY_ORG_PATH).then(function(result) {
          return { data: parseLegacyOverviewJs(result.text), updated: result.updated };
        });
      });
  })
  .then(function(result) {
    const d = result.data || {};
    OVERVIEW_DATA = {
      units:      Array.isArray(d.units) ? d.units : [],
      leases:     Array.isArray(d.leases) ? d.leases : [],
      properties: Array.isArray(d.properties) ? d.properties : [],
      owners:     Array.isArray(d.owners) ? d.owners : []
    };
    setDataTimestamp(result.updated);
    initFilters();               // rebuilds property/owner dropdowns for this org
    document.getElementById('filterUsage').value = '';
    filters = { property: '', usage: '', owner: '' };
    updatePdfButton();
    render();
  })
  .catch(function(err) {
    console.error('Overview data fetch failed for org "' + orgId + '":', err);
    OVERVIEW_DATA = { units: [], leases: [], properties: [], owners: [] };
    initFilters();
    showOverviewMessage('No data has been uploaded for this organisation yet, or you do not have access to it. Please contact an administrator.');
  });
};

// Populate the organisation dropdown. Hidden entirely when the user only has
// one organisation, so single-org users see exactly what they see today.
window.initOrgSelector = function(orgs, initialId) {
  const sel   = document.getElementById('filterOrg');
  const group = document.getElementById('orgFilterGroup');

  sel.innerHTML = '';
  orgs.forEach(function(o) {
    const opt = document.createElement('option');
    opt.value = o.id;
    opt.textContent = o.name;
    sel.appendChild(opt);
  });

  if (orgs.length > 1) {
    sel.value = initialId;
    group.style.display = 'flex';
    sel.addEventListener('change', function() {
      try { localStorage.setItem('eqarcom.overview.org', sel.value); } catch (e) {}
      window.loadOverviewData(sel.value);
    });
  } else {
    group.style.display = 'none';
  }
};

// ── PDF Generation ──────────────────────────────────────────
function generatePDF() {
  const ownerName = document.getElementById('filterOwner').value;
  if (!ownerName) {
    alert('Please select an owner from the filter dropdown first.');
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();

  // Colours
  const DARK_BG = [15, 23, 42];
  const CARD_BG = [22, 32, 50];
  const HEADER_BG = [16, 69, 95];
  const ACCENT = [53, 114, 150];
  const ACCENT_LIGHT = [111, 177, 201];
  const TEXT_W = [241, 245, 249];
  const TEXT_M = [148, 163, 184];
  const GRID = [45, 64, 96];
  const GREEN = [29, 95, 60];
  const RED = [127, 29, 29];
  const AMBER = [146, 64, 14];

  // Get data for this owner
  const leases = OVERVIEW_DATA.leases.filter(l => l.owner === ownerName);
  const active = leases.filter(isInPlaceLease);   // includes Expired-but-in-place
  const props = [...new Set(active.map(l => l.property))].sort();
  const ownerUnits = OVERVIEW_DATA.units.filter(u => props.includes(u.property));

  const totalRent = active.reduce((s, l) => s + (l.annual_rent || 0), 0);
  const resActive = active.filter(l => usageOf(l) === 'Residential');
  const comActive = active.filter(l => usageOf(l) === 'Commercial');
  const resUnits = ownerUnits.filter(u => usageOf(u) === 'Residential');
  const comUnits = ownerUnits.filter(u => usageOf(u) === 'Commercial');
  const occPct = ownerUnits.length ? (active.length / ownerUnits.length * 100) : 0;

  active.forEach(l => {
    try { l._days = Math.floor((new Date(l.end_date) - TODAY) / MS_DAY); } catch(e) { l._days = 999; }
  });

  const expired = active.filter(l => l._days < 0);
  const exp30 = active.filter(l => l._days >= 0 && l._days <= 30);
  const exp60 = active.filter(l => l._days > 30 && l._days <= 60);
  const exp90 = active.filter(l => l._days > 60 && l._days <= 90);
  const exp120 = active.filter(l => l._days > 90 && l._days <= 120);

  // Nationality
  const natMap = {};
  active.forEach(l => { const n = l.nationality || 'Unknown'; natMap[n] = (natMap[n] || 0) + 1; });
  const topNats = Object.entries(natMap).sort((a, b) => b[1] - a[1]).slice(0, 10);

  // Unit mix with avg rent
  const mixMap = {};
  active.forEach(l => {
    const bt = usageOf(l) === 'Residential' ? normBedroom(l.bedrooms) : (l.bedrooms || normUnitType(l.unit_type) || 'Other');
    if (!mixMap[bt]) mixMap[bt] = { count: 0, rent: 0 };
    mixMap[bt].count++;
    mixMap[bt].rent += (l.annual_rent || 0);
  });

  const todayStr = TODAY.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

  // ── Background ──
  doc.setFillColor(...DARK_BG);
  doc.rect(0, 0, W, H, 'F');

  // ── Header band ──
  doc.setFillColor(...HEADER_BG);
  doc.rect(0, 0, W, 18, 'F');
  doc.setFillColor(...ACCENT_LIGHT);
  doc.rect(0, 18, W, 0.8, 'F');

  doc.setTextColor(...TEXT_W);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(14);
  doc.text('Portfolio Overview Report', 10, 12);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(7.5);
  doc.setTextColor(...TEXT_M);
  doc.text('Generated: ' + todayStr, W - 10, 8, { align: 'right' });
  doc.text('EQARCOM Property Management', W - 10, 13, { align: 'right' });

  // ── Owner name + subtitle ──
  let y = 26;
  doc.setTextColor(...TEXT_W);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.text(ownerName, 10, y);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(7.5);
  doc.setTextColor(...TEXT_M);
  doc.text(props.length + ' Properties  |  ' + ownerUnits.length + ' Total Units  |  ' + active.length + ' In-Place Leases', 10, y + 5);

  // ── KPI Cards ──
  y += 12;
  const kpiW = (W - 50) / 4;
  const kpiH = 18;
  const kpis = [
    { label: 'OVERALL OCCUPANCY', value: Math.round(occPct) + '%', sub: 'Res: ' + resActive.length + '/' + resUnits.length + '  |  Com: ' + comActive.length + '/' + comUnits.length },
    { label: 'ANNUAL RENT POOL', value: 'AED ' + Math.round(totalRent).toLocaleString(), sub: 'Res: AED ' + Math.round(resActive.reduce((s,l)=>s+(l.annual_rent||0),0)).toLocaleString() },
    { label: 'EXPIRING (120 DAYS)', value: String(exp30.length + exp60.length + exp90.length + exp120.length), sub: '30d: ' + exp30.length + '  |  60d: ' + exp60.length + '  |  90d: ' + exp90.length + '  |  120d: ' + exp120.length },
    { label: 'EXPIRED LEASES', value: String(expired.length), sub: expired.length > 0 ? 'Action required' : 'No expired leases' }
  ];

  kpis.forEach((kpi, i) => {
    const x = 10 + i * (kpiW + 10);
    doc.setFillColor(...CARD_BG);
    doc.roundedRect(x, y, kpiW, kpiH, 2, 2, 'F');
    doc.setFillColor(...ACCENT);
    doc.rect(x, y, kpiW, 1.2, 'F');

    doc.setTextColor(...TEXT_M);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(5.5);
    doc.text(kpi.label, x + 4, y + 5.5);

    doc.setTextColor(...TEXT_W);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(10);
    doc.text(kpi.value, x + 4, y + 12);

    doc.setTextColor(...TEXT_M);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(5.5);
    doc.text(kpi.sub, x + 4, y + 16);
  });

  // ── Occupancy by Property table (left) ──
  y += kpiH + 8;
  const leftW = W * 0.55;

  doc.setTextColor(...ACCENT_LIGHT);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(7);
  doc.text('OCCUPANCY BY PROPERTY', 10, y);
  doc.setDrawColor(...GRID);
  doc.line(65, y - 0.5, leftW, y - 0.5);

  const propTableData = props.map(p => {
    const pUnits = ownerUnits.filter(u => u.property === p);
    const pActive = active.filter(l => l.property === p);
    const pVacant = pUnits.length - pActive.length;
    const pOcc = pUnits.length ? Math.round(pActive.length / pUnits.length * 100) : 0;
    const pRent = pActive.reduce((s, l) => s + (l.annual_rent || 0), 0);
    const avgRent = pActive.length ? Math.round(pRent / pActive.length) : 0;
    return [p, String(pUnits.length), String(pActive.length), String(pVacant), pOcc + '%', Math.round(pRent).toLocaleString(), Math.round(avgRent).toLocaleString()];
  });
  const totalVacant = ownerUnits.length - active.length;
  const avgRentAll = active.length ? Math.round(totalRent / active.length) : 0;
  propTableData.push(['Total', String(ownerUnits.length), String(active.length), String(totalVacant), Math.round(occPct) + '%', Math.round(totalRent).toLocaleString(), Math.round(avgRentAll).toLocaleString()]);

  doc.autoTable({
    startY: y + 2,
    margin: { left: 10, right: W - leftW },
    head: [['Property', 'Units', 'Leased', 'Vacant', 'Occ%', 'Annual Rent', 'Avg/Unit']],
    body: propTableData,
    styles: { fontSize: 6.5, cellPadding: 2, textColor: TEXT_W, fillColor: CARD_BG, lineColor: GRID, lineWidth: 0.2, font: 'helvetica' },
    headStyles: { fillColor: HEADER_BG, textColor: TEXT_W, fontStyle: 'bold', fontSize: 6, halign: 'center' },
    columnStyles: {
      0: { halign: 'left', cellWidth: 40 },
      1: { halign: 'center', cellWidth: 12 },
      2: { halign: 'center', cellWidth: 12 },
      3: { halign: 'center', cellWidth: 12 },
      4: { halign: 'center', cellWidth: 12 },
      5: { halign: 'right', cellWidth: 28 },
      6: { halign: 'right', cellWidth: 22 }
    },
    willDrawCell: function(data) {
      // Bold + different bg for totals row
      if (data.row.index === propTableData.length - 1) {
        data.cell.styles.fontStyle = 'bold';
        data.cell.styles.fillColor = [26, 45, 66];
      }
    },
    didParseCell: function(data) {
      if (data.row.index === propTableData.length - 1) {
        data.cell.styles.fontStyle = 'bold';
      }
    }
  });

  const propTableEnd = doc.lastAutoTable.finalY;

  // ── Unit Mix table (right, top) ──
  const rightX = leftW + 8;
  doc.setTextColor(...ACCENT_LIGHT);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(7);
  doc.text('UNIT MIX (ACTIVE LEASES)', rightX, y);
  doc.setDrawColor(...GRID);
  doc.line(rightX + 55, y - 0.5, W - 10, y - 0.5);

  const mixData = Object.entries(mixMap).sort((a, b) => b[1].count - a[1].count).map(([bt, d]) => {
    const p = active.length ? Math.round(d.count / active.length * 100) : 0;
    const avg = d.count ? Math.round(d.rent / d.count) : 0;
    return [bt, String(d.count), p + '%', Math.round(avg).toLocaleString()];
  });

  doc.autoTable({
    startY: y + 2,
    margin: { left: rightX, right: 10 },
    head: [['Type', 'Count', '%', 'Avg Rent']],
    body: mixData,
    styles: { fontSize: 6.5, cellPadding: 2, textColor: TEXT_W, fillColor: CARD_BG, lineColor: GRID, lineWidth: 0.2, font: 'helvetica' },
    headStyles: { fillColor: HEADER_BG, textColor: TEXT_W, fontStyle: 'bold', fontSize: 6, halign: 'center' },
    columnStyles: {
      0: { halign: 'left', cellWidth: 22 },
      1: { halign: 'center', cellWidth: 14 },
      2: { halign: 'center', cellWidth: 12 },
      3: { halign: 'right', cellWidth: 22 }
    }
  });

  const mixTableEnd = doc.lastAutoTable.finalY;

  // ── Nationality Split (right, below unit mix) ──
  const natY = mixTableEnd + 6;
  doc.setTextColor(...ACCENT_LIGHT);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(7);
  doc.text('TENANT NATIONALITY SPLIT', rightX, natY);
  doc.setDrawColor(...GRID);
  doc.line(rightX + 55, natY - 0.5, W - 10, natY - 0.5);

  const natData = topNats.map(([n, cnt]) => {
    const p = active.length ? Math.round(cnt / active.length * 100) : 0;
    return [n, String(cnt), p + '%'];
  });

  doc.autoTable({
    startY: natY + 2,
    margin: { left: rightX, right: 10 },
    head: [['Nationality', 'Count', '%']],
    body: natData,
    styles: { fontSize: 6.5, cellPadding: 2, textColor: TEXT_W, fillColor: CARD_BG, lineColor: GRID, lineWidth: 0.2, font: 'helvetica' },
    headStyles: { fillColor: HEADER_BG, textColor: TEXT_W, fontStyle: 'bold', fontSize: 6, halign: 'center' },
    columnStyles: {
      0: { halign: 'left', cellWidth: 36 },
      1: { halign: 'center', cellWidth: 14 },
      2: { halign: 'center', cellWidth: 12 }
    }
  });

  // ── Lease Expiry Schedule (below property table) ──
  const expY = propTableEnd + 6;
  doc.setTextColor(...ACCENT_LIGHT);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(7);
  doc.text('LEASE EXPIRY SCHEDULE', 10, expY);
  doc.setDrawColor(...GRID);
  doc.line(55, expY - 0.5, leftW, expY - 0.5);

  const expData = props.map(p => {
    const pActive = active.filter(l => l.property === p);
    return [
      p,
      String(pActive.filter(l => l._days < 0).length),
      String(pActive.filter(l => l._days >= 0 && l._days <= 30).length),
      String(pActive.filter(l => l._days > 30 && l._days <= 60).length),
      String(pActive.filter(l => l._days > 60 && l._days <= 90).length),
      String(pActive.filter(l => l._days > 90 && l._days <= 120).length)
    ];
  });
  expData.push(['Total', String(expired.length), String(exp30.length), String(exp60.length), String(exp90.length), String(exp120.length)]);

  doc.autoTable({
    startY: expY + 2,
    margin: { left: 10, right: W - leftW },
    head: [['Property', 'Expired', '30 Days', '60 Days', '90 Days', '120 Days']],
    body: expData,
    styles: { fontSize: 6.5, cellPadding: 2, textColor: TEXT_W, fillColor: CARD_BG, lineColor: GRID, lineWidth: 0.2, font: 'helvetica' },
    headStyles: { fillColor: HEADER_BG, textColor: TEXT_W, fontStyle: 'bold', fontSize: 6, halign: 'center' },
    columnStyles: {
      0: { halign: 'left', cellWidth: 40 },
      1: { halign: 'center', cellWidth: 16 },
      2: { halign: 'center', cellWidth: 16 },
      3: { halign: 'center', cellWidth: 16 },
      4: { halign: 'center', cellWidth: 16 },
      5: { halign: 'center', cellWidth: 16 }
    },
    willDrawCell: function(data) {
      if (data.row.index === expData.length - 1) {
        data.cell.styles.fontStyle = 'bold';
        data.cell.styles.fillColor = [26, 45, 66];
      }
      // Colour-code expiry numbers (body only, not header)
      if (data.section === 'body' && data.column.index === 1) {
        const v = parseInt(data.cell.raw);
        if (v > 0) data.cell.styles.textColor = [248, 113, 113]; // red
      }
      if (data.section === 'body' && data.column.index === 2) {
        const v = parseInt(data.cell.raw);
        if (v > 0) data.cell.styles.textColor = [251, 191, 36]; // amber
      }
    }
  });

  // ── Footer ──
  doc.setDrawColor(...GRID);
  doc.line(10, H - 8, W - 10, H - 8);
  doc.setTextColor(...TEXT_M);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(5.5);
  doc.text('CONFIDENTIAL \u2014 Prepared by EQARCOM Property Management', 10, H - 4);
  doc.text('Report Date: ' + todayStr, W - 10, H - 4, { align: 'right' });

  // Save
  const safeName = ownerName.replace(/[^a-zA-Z0-9]/g, '_').substring(0, 40);
  doc.save('Portfolio_Overview_' + safeName + '.pdf');
}
</script>

<!-- Firebase auth guard -->
<script type="module">
  import { auth, db, onAuthStateChanged, signOut, doc, getDoc, updateDoc, getDocs, collection } from './firebase-init.js';

  const MGMT_ORGS_COLLECTION = 'management_orgs';
  const DEFAULT_ORG_ID = 'eqarat';

  // Every organisation registered in Firestore, in display order.
  async function fetchAllOrgs() {
    try {
      const snap = await getDocs(collection(db, MGMT_ORGS_COLLECTION));
      const list = [];
      snap.forEach(function(d) {
        const data = d.data() || {};
        list.push({ id: d.id, name: data.name || d.id });
      });
      list.sort(function(a, b) { return a.name.localeCompare(b.name); });
      return list;
    } catch (e) {
      console.warn('Could not read organisation registry:', e);
      return [];
    }
  }

  // Which organisations this user may see on the Management Overview.
  // Admins see all. Users with no managementOrgs field set are legacy
  // single-org users and keep seeing the default organisation.
  function resolveUserOrgs(userData, allOrgs) {
    if (userData.isAdmin) {
      return allOrgs.length ? allOrgs : [{ id: DEFAULT_ORG_ID, name: 'Eqarat' }];
    }

    const ids = Array.isArray(userData.managementOrgs)
      ? userData.managementOrgs
      : [DEFAULT_ORG_ID];

    const byId = {};
    allOrgs.forEach(function(o) { byId[o.id] = o; });
    return ids.map(function(id) { return byId[id] || { id: id, name: id }; });
  }

  document.getElementById('logout-btn').addEventListener('click', function() {
    this.disabled = true;
    signOut(auth).then(function() { window.location.href = 'index.html'; });
  });

  onAuthStateChanged(auth, async function(user) {
    if (!user) { window.location.href = 'index.html'; return; }
    try {
      var email = user.email.toLowerCase();
      var userDoc = await getDoc(doc(db, 'users', email));
      if (!userDoc.exists() || !userDoc.data().enabled) {
        await signOut(auth);
        window.location.href = 'index.html';
        return;
      }
      var userData = userDoc.data();

      // Check managementDashboard permission
      if (!userData.managementDashboard && !userData.isAdmin) {
        window.location.href = 'dashboard.html';
        return;
      }

      if (userData.isAdmin) {
        document.getElementById('admin-link').style.display = 'inline-flex';
      }
      // Show tabs based on dashboard permissions
      if (userData.payments !== false || userData.isAdmin) {
        document.getElementById('payments-tab').style.display = 'inline-flex';
      }
      if (userData.serviceBookings !== false || userData.isAdmin) {
        document.getElementById('bookings-tab').style.display = 'inline-flex';
      }
      document.body.classList.add('authenticated');

      // Resolve which organisations this user may view, then load the first.
      var allOrgs  = await fetchAllOrgs();
      var userOrgs = resolveUserOrgs(userData, allOrgs);

      if (!userOrgs.length) {
        document.getElementById('dashboard').innerHTML =
          '<p style="text-align:center;color:#94a3b8;padding:40px;">No organisation has been assigned to your account. Please contact an administrator.</p>';
      } else {
        var saved = null;
        try { saved = localStorage.getItem('eqarcom.overview.org'); } catch (e) {}
        var initialId = userOrgs.some(function(o) { return o.id === saved; })
          ? saved
          : userOrgs[0].id;

        window.initOrgSelector(userOrgs, initialId);
        window.loadOverviewData(initialId);
      }

      updateDoc(doc(db, 'users', email), { lastVisited: new Date().toISOString() }).catch(function(){});
    } catch (e) {
      console.error('Auth check failed:', e);
      await signOut(auth);
      window.location.href = 'index.html';
    }
  });
</script>
